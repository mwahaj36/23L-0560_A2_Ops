name: VisionGuard CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install test dependencies
        run: pip install Flask Pillow SQLAlchemy requests pytest flake8 numpy
      - name: Lint
        run: flake8 src tests
      - name: Test
        run: pytest -q tests
      - name: Build Docker image
        run: docker build -t visionguard:${{ github.sha }} .
